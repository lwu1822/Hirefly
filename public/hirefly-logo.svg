<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Background -->
  <circle cx="40" cy="40" r="38" fill="#0f2922"/>

  <!-- Left upper wing -->
  <path d="M38 32 C26 21 10 27 15 38 C18 46 36 41 38 36 Z"
        fill="rgba(110,231,160,0.13)" stroke="#6ee7a0" stroke-width="2" stroke-linejoin="round"/>
  <!-- Left lower wing -->
  <path d="M38 37 C27 28 13 35 18 44 C21 50 37 45 38 41 Z"
        fill="rgba(110,231,160,0.08)" stroke="#6ee7a0" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Right upper wing (mirror) -->
  <path d="M42 32 C54 21 70 27 65 38 C62 46 44 41 42 36 Z"
        fill="rgba(110,231,160,0.13)" stroke="#6ee7a0" stroke-width="2" stroke-linejoin="round"/>
  <!-- Right lower wing (mirror) -->
  <path d="M42 37 C53 28 67 35 62 44 C59 50 43 45 42 41 Z"
        fill="rgba(110,231,160,0.08)" stroke="#6ee7a0" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Body -->
  <rect x="36" y="42" width="8" height="20" rx="4" fill="#1a7042"/>

  <!-- Head -->
  <circle cx="40" cy="37" r="7" fill="#1a7042"/>

  <!-- Eye -->
  <circle cx="43" cy="34" r="2.3" fill="white"/>
  <circle cx="43.6" cy="33.4" r="1.1" fill="#0f2922"/>

  <!-- Abdomen glow -->
  <circle cx="40" cy="62" r="3.5" fill="#4ade80"/>
  <circle cx="40" cy="62" r="6" fill="rgba(74,222,128,0.18)"/>

  <!-- Left antenna -->
  <line x1="37" y1="31" x2="29" y2="19" stroke="#6ee7a0" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="29" cy="19" r="2.4" fill="#6ee7a0"/>

  <!-- Right antenna -->
  <line x1="43" y1="31" x2="51" y2="19" stroke="#6ee7a0" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="51" cy="19" r="2.4" fill="#6ee7a0"/>
</svg>
